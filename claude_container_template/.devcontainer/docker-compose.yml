# claude 関数用汎用テンプレート
# name と container_name は `llm` 関数が (Get-Item .).Name（ディレクトリ名）で参照する。
# このテンプレートをコピーして使う際はプロジェクトのディレクトリ名に合わせること。
#
# gws-login / nlm-login (プロファイル関数) はこの .devcontainer 内のスクリプトに委譲する形で
# 対応済み。gws-login は client_secret.json (下記マウント) を前提とするため、ホスト側で
# 事前に `gws auth login` 済みであること (~/.config/gws/client_secret.json が存在すること)。
#
# API キー: 下の environment: に名前だけ書くと、ホストの環境変数の値がコンテナに入る
# （ホストに無い名前は入らない）。値はコンテナ作成時に固定されるので、ホストで変えたら `llm -Rebuild`。使わない名前は消し、必要な名前を足す。
# 値は docker inspect で見えるので、このコンテナで本当に使うものだけにすること。
#
# Orca（SSH worktrees）からの接続:
#   - sshd は claude-base に入っていて、command を指定しなければ起動する。
#   - コンテナの 2222 番をホストの 127.0.0.1 にだけ公開する。ホスト側の番号は `llm` が SSH_PORT として
#     割り当て、~/.ssh/config に `Host <ディレクトリ名の小文字>` を書く。llm を通さずに起動すると
#     Docker が空き番号を選ぶ（次の llm で作り直される）。
#   - 鍵は使わず node の空パスワードで入る。ports を 127.0.0.1 以外に広げないこと。
#   - SSH セッションにも environment: の変数がそのまま見える。

name: claude_container_template

services:
  node:
    build:
      context: ../..
      dockerfile: claude_container_template/.devcontainer/Dockerfile
    user: node
    container_name: claude_container_template
    volumes:
      - ..:/workspace:cached
      - .:/workspace/.devcontainer:ro
      - ../.mcp.json:/workspace/.mcp.json:ro
      - ${USERPROFILE}/.config/gws/client_secret.json:/home/node/.config/gws/client_secret.json:ro
    ports:
      - "127.0.0.1:${SSH_PORT:-}:2222"
    working_dir: /workspace
    environment:
      - PROJECT_NAME=${COMPOSE_PROJECT_NAME}
      # LLM / AI
      - ANTHROPIC_API_KEY
      - ANTIGRAVITY_API_KEY
      - PERPLEXITY_API_KEY           # perplexity MCP
      # 検索 / Web
      - CONTEXT7_API_KEY             # context7 MCP
      # 開発 / VCS
      - GITHUB_TOKEN
      - GH_TOKEN
      - GITHUB_MCP_PAT               # github MCP
      # Google / Cloud
      - GWS_MCP_CLIENT_ID            # google_workspace MCP
      - GWS_MCP_CLIENT_SECRET        # google_workspace MCP
      - GCP_PROJECT_ID               # gcp-hardening-* MCP（非シークレット）
      - GEMINI_MODEL                 # gemini-cli MCP（非シークレット）
      # 生産性 / コマース
      - TODOIST_API_KEY              # todoist MCP
      - RAINDROP_ACCESS_TOKEN        # raindrop MCP
      - KEEPA_API_KEY                # keepa MCP
