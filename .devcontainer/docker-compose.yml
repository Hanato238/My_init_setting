# My_init_setting 専用の開発コンテナ
# 共通部分（ports・seccomp・claude-home・共通プラグイン・CLAUDE.md・hook・agy 設定・共通 env・Orca/SSH・github MCP サーバー）は
# ../../container/base.yml にある。ここは My_init_setting 固有の差分だけ。
# name と container_name は `llm` 関数が (Get-Item .).Name（ディレクトリ名）で参照する。
# .devcontainer/zellij-layout.kdl を COPY するので build の context は .devcontainer（.）。
#
# マウント方針:
#   - リポジトリ全体（..）は書き込み可。Claude がスクリプトを編集・テストする。
#   - .git/ も書き込み可（Orca の worktree 作成・commit をコンテナ内で行うため。push はホスト側）。
#     コンテナ内で hooks・config（core.hooksPath / core.fsmonitor / alias）を書き換えられると
#     ホストの git がそれを実行するので、ホストで git を使う前に .git/config と .git/hooks を確認すること。
#     コンテナ内で作った worktree の gitdir はコンテナのパスになり、ホストからは prunable に見える。
#     ホスト側で `git worktree prune` しないこと。
#   - ホスト上で実行される設定は :ro で上に重ねる。コンテナ内で書き換えると、後でホストの
#     Claude Code・docker compose がその内容を実行してしまうため。
#       .devcontainer/ マウントの追加 → 次の `llm -Rebuild` でコンテナの外に出られる
#       .mcp.json      MCP サーバーの command → ホストの Claude Code が起動
#       .claude/settings.json・settings.local.json  hooks・許可設定 → ホストの Claude Code が実行
#   - .claude/ のそれ以外（skills・commands）は書き込み可。skill の frontmatter hooks もホストで実行されうるため、
#     ホストで skill を使う前に .claude/ の diff を確認すること。
#   - :ro で重ねるファイルは必ずホストに存在させる（git 管理下）。無いと Docker が空ディレクトリを作る。
#   - push はホスト側で行う。
#   - Orca では my_init_setting を SSH target に追加して /workspace を開き、worktree の作成先は
#     /workspace/.worktrees（gitignore 済み）にする。/home/node 配下はコンテナの作り直しで消える。
#
# 許可設定:
#   - コンテナ専用の ./managed-settings.json を managed settings としてマウントする（ユーザー設定では緩められない）。
#     共通のプラグイン・statusline・hook は base.yml の drop-in（10-common.json）が足す。
#     ルールを変えたらコンテナを再起動するだけでよい（再ビルド不要）。
#
# 秘密情報の方針:
#   - bws トークンは置かない。base.yml と下の environment: に列挙したものだけをホストの環境変数から引き継ぐ。
#   - GITHUB_MCP_PAT には My_init_setting だけに絞った fine-grained PAT（Issues: RW / Metadata: R）を渡す。
#     ホストの GITHUB_MCP_PAT（全リポジトリ用）が入らないよう、別名の GITHUB_MCP_PAT_MY_INIT_SETTING から割り当てる。
#   - トークンは MCP サーバーだけが使う。Bash からは sandbox.credentials で見えなくしてある。

name: my_init_setting

services:
  node:
    extends:
      file: ../../container/base.yml
      service: node
    container_name: My_init_setting
    build:
      context: .
      dockerfile_inline: |
        ARG BASE_IMAGE
        FROM $${BASE_IMAGE}
        USER root

        # 検証ツール: shellcheck（ubuntu/・android/ の bash）、pwsh + Pester（windows/tests）。
        # pwsh は 7 系なので、Windows PowerShell 5.1 固有の挙動と Windows 依存のテストはホストで確認する。
        RUN apt-get update && apt-get install -y --no-install-recommends shellcheck \
            && curl -fsSL https://packages.microsoft.com/config/debian/12/packages-microsoft-prod.deb -o /tmp/ms-prod.deb \
            && dpkg -i /tmp/ms-prod.deb \
            && rm /tmp/ms-prod.deb \
            && apt-get update && apt-get install -y --no-install-recommends powershell \
            && rm -rf /var/lib/apt/lists/*
        ARG PESTER_VERSION=5.7.1
        RUN pwsh -NoProfile -Command "Set-PSRepository PSGallery -InstallationPolicy Trusted; Install-Module Pester -RequiredVersion $${PESTER_VERSION} -Scope AllUsers -Force"

        COPY --chown=node:node zellij-layout.kdl /home/node/.config/zellij/layouts/default.kdl

        USER node
    volumes:
      - ..:/workspace
      - .:/workspace/.devcontainer:ro
      - ../.mcp.json:/workspace/.mcp.json:ro
      - ../.claude/settings.json:/workspace/.claude/settings.json:ro
      - ../.claude/settings.local.json:/workspace/.claude/settings.local.json:ro
      - ./managed-settings.json:/etc/claude-code/managed-settings.json:ro
    environment:
      - GITHUB_MCP_PAT=${GITHUB_MCP_PAT_MY_INIT_SETTING}

# extends ではトップレベルの volumes が継承されないため必須。
volumes:
  claude-home:
